version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]

  - package-ecosystem: cargo
    directories:
      - /benchmarks/egui
      - /benchmarks/gpui
      - /benchmarks/gpui-fast
      - /examples/rust-native/adder/rust
      - /native/internal/roundtrip/rust
    multi-ecosystem-group: dependencies
    patterns: ["*"]
